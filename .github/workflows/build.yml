name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Buildozer
      uses: kivy/buildozer-action@v0.4.0
      with:
        command: |
          buildozer init
          sed -i 's/# title = My Application/title = ANSER Motivation/' buildozer.spec
          sed -i 's/# package.name = myapp/package.name = anservation/' buildozer.spec
          sed -i 's/# package.domain = org.test/package.domain = org.anser/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,kivymd,plyer,arabic-reshaper,python-bidi/' buildozer.spec
          sed -i 's/# android.permissions =/android.permissions = VIBRATE, INTERNET, POST_NOTIFICATIONS/' buildozer.spec
          buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: anser-apk
        path: bin/*.apk
