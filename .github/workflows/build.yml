name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies & Buildozer
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev
        pip install --upgrade pip
        pip install buildozer

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/# title = My Application/title = ANSER Motivation/' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = anservation/' buildozer.spec
        sed -i 's/# package.domain = org.test/package.domain = org.anser/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,kivymd,plyer,arabic-reshaper,python-bidi/' buildozer.spec
        sed -i 's/# android.permissions =/android.permissions = VIBRATE, INTERNET, POST_NOTIFICATIONS/' buildozer.spec
        
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
